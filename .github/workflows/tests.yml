name: Тесты

on:
  push:
  pull_request:

jobs:
  tests:
    name: Тесты (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8 — минимальная версия из README, 3.14 — та, на которой собирается exe
        python: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Код компилируется
        run: python -m compileall -q main.py launcher tools
      - name: Тесты
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: pyflakes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install pyflakes
      - run: python -m pyflakes main.py launcher tests
